
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Check current weather for cities around the world.">
  <title>WeatherNow | Weather App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="eyebrow">WEATHER DASHBOARD</p>
      <h1>Weather<span>Now</span></h1>
      <p class="subtitle">Know the weather. Plan your day.</p>
    </header>

    <form id="searchForm" class="search-form">
      <label class="sr-only" for="cityInput">Enter city name</label>
      <input
        type="text"
        id="cityInput"
        placeholder="Search city, e.g. Faridabad"
        autocomplete="off"
        maxlength="100"
        required
      >
      <button id="searchBtn" type="submit">Search</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="weatherCard" class="weather-card" hidden>
      <div class="weather-top">
        <div>
          <p class="label">CURRENT WEATHER</p>
          <h2 id="cityName">City</h2>
          <p id="weatherDescription">Weather condition</p>
        </div>
        <div id="weatherIcon" class="weather-icon" aria-hidden="true">☀️</div>
      </div>

      <div class="temperature-row">
        <p id="temperature" class="temperature">--°C</p>
        <p class="feels">Feels like <span id="feelsLike">--°C</span></p>
      </div>

      <div class="details">
        <div class="detail-card">
          <span>💧 Humidity</span>
          <strong id="humidity">--%</strong>
        </div>
        <div class="detail-card">
          <span>💨 Wind Speed</span>
          <strong id="windSpeed">-- km/h</strong>
        </div>
        <div class="detail-card">
          <span>🌧️ Precipitation</span>
          <strong id="precipitation">-- mm</strong>
        </div>
      </div>

      <p id="updatedAt" class="updated"></p>
    </section>

    <p class="credit">
      Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a>
    </p>
  </main>
</body>
</html>
